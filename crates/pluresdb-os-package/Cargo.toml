[package]
name = "pluresdb-os-package"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Narrowest real slice of praxis-os: os.package desired/actual state in PluresDB, reconciled by a reactive actor that shells out to a package manager (nix first)."
keywords = ["praxis-os", "package-manager", "reconciler"]

[[bin]]
name = "px-shell"
path = "src/bin/px_shell.rs"

[dependencies]
pluresdb-core = { path = "../pluresdb-core", default-features = false, features = ["native"] }
pluresdb-procedures = { path = "../pluresdb-procedures" }
pluresdb-storage = { path = "../pluresdb-storage", default-features = false, features = ["native"] }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
