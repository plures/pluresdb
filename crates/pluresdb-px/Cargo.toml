[package]
name = "pluresdb-px"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The .px declarative language runtime for PluresDB — parser, compiler, executor, and reactive procedure engine."
keywords = ["database", "declarative", "dsl", "reactive", "praxis"]

[features]
default = ["watcher", "async"]
watcher = ["notify", "walkdir"]
async = ["tokio", "futures"]
# Passthrough only — pluresdb-px itself doesn't use pluresdb-core's HNSW/embedding
# native path, but downstream native consumers may still want it enabled.
native = ["pluresdb-procedures/native"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
# Bug found 2026-07-28 (plures/pluresdb#1088 CI, ci/wasm): this line was missing
# `default-features = false`, unlike every other pluresdb-* dep in this workspace
# (pluresdb-wasm, pluresdb-chronos, pluresdb-node all set it explicitly). That let
# pluresdb-procedures' own `default = ["native"]` leak `native` -> pluresdb-core
# `native` -> hnsw_rs -> rand 0.9 -> getrandom 0.3.3 into the wasm32 build graph,
# even though pluresdb-wasm correctly disabled default features on its OWN direct
# deps. Feature unification across the workspace graph doesn't respect a
# downstream crate's intent if a transitive dep re-enables it.
pluresdb-procedures = { path = "../pluresdb-procedures", default-features = false }
async-trait = "0.1"
tokio = { workspace = true, features = ["time", "rt"], optional = true }
tracing = "0.1"

# praxis-lang — the single-source-of-truth .px language engine (M6: stop duplicating it).
# Pinned to git rev 37be99e on plures/praxis-lang (BOM-free manifests). pluresdb-px imports parse+AST+eval
# from here and keeps ONLY its unique record-lowering/executor/store runtime.
px-ast = { git = "https://github.com/plures/praxis-lang.git", rev = "37be99e95f2db8e530ea7dd24ec2d0b01113ceeb", package = "px-ast" }
px-compiler = { git = "https://github.com/plures/praxis-lang.git", rev = "37be99e95f2db8e530ea7dd24ec2d0b01113ceeb", package = "px-compiler" }
px-eval = { git = "https://github.com/plures/praxis-lang.git", rev = "37be99e95f2db8e530ea7dd24ec2d0b01113ceeb", package = "px-eval" }
futures = { version = "0.3", optional = true }
regex = "1"

# Optional (watcher feature)
notify = { version = "8", optional = true }
walkdir = { version = "2", optional = true }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }
serde_json.workspace = true
