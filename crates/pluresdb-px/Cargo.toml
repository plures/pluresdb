[package]
name = "pluresdb-px"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The .px declarative language runtime for PluresDB — parser, compiler, executor, and reactive procedure engine."
keywords = ["database", "declarative", "dsl", "reactive", "praxis"]

[features]
default = ["watcher", "async"]
watcher = ["notify", "walkdir"]
async = ["tokio", "futures"]
# Passthrough only — pluresdb-px itself doesn't use pluresdb-core's HNSW/embedding
# native path, but downstream native consumers may still want it enabled.
native = ["pluresdb-procedures/native"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
# `default-features = false` prevents pluresdb-procedures' `native` feature from leaking
# into the wasm32 build graph via `native` -> pluresdb-core -> hnsw_rs -> rand -> getrandom.
# Feature unification across the dependency graph does not respect a downstream crate's intent
# if an intermediate crate re-enables a default feature.
# See: crates/pluresdb-wasm/Cargo.toml for the intended wasm feature set.
pluresdb-procedures = { path = "../pluresdb-procedures", default-features = false }
async-trait = "0.1"
tokio = { workspace = true, features = ["time", "rt"], optional = true }
tracing = "0.1"

# praxis-lang — the single-source-of-truth .px language engine (M6: stop duplicating it).
# Pinned to git rev 37be99e on plures/praxis-lang (BOM-free manifests). pluresdb-px imports parse+AST+eval
# from here and keeps ONLY its unique record-lowering/executor/store runtime.
px-ast = { git = "https://github.com/plures/praxis-lang.git", rev = "fdd510f5b5abe64063b234b6f0029c6ebc4e359c", package = "px-ast" }
px-check = { git = "https://github.com/plures/praxis-lang.git", rev = "fdd510f5b5abe64063b234b6f0029c6ebc4e359c", package = "px-check" }
px-compiler = { git = "https://github.com/plures/praxis-lang.git", rev = "fdd510f5b5abe64063b234b6f0029c6ebc4e359c", package = "px-compiler" }
px-eval = { git = "https://github.com/plures/praxis-lang.git", rev = "fdd510f5b5abe64063b234b6f0029c6ebc4e359c", package = "px-eval" }
futures = { version = "0.3", optional = true }
regex = "1"

# Optional (watcher feature)
notify = { version = "8", optional = true }
walkdir = { version = "2", optional = true }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }
serde_json.workspace = true
pluresdb-core = { path = "../pluresdb-core", default-features = false }
